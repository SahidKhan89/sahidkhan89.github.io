name: Post Sector Heatmap to Social Media

on:
  schedule:
    - cron: '27 21 * * 2,5'     # Tue/Fri at 21:27 UTC (10:27pm BST / 9:27pm GMT in winter) — after
                                 # US market close, offset off :00 to avoid GitHub's on-the-hour
                                 # schedule congestion
  workflow_dispatch:
    inputs:
      date:
        description: 'Force a specific date label (YYYY-MM-DD) — skips "last market day"'
        required: false
        default: ''

jobs:
  post-sector-heatmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate sector heatmap card
        run: python scripts/generate_sector_heatmap_card.py
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}

      - name: Generate sector heatmap reel
        run: python scripts/generate_sector_heatmap_reel.py
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}

      - name: Commit card image and reel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/sector-heatmap/ images/sector-heatmap-reel/
          git diff --staged --quiet || git commit -m "chore: add sector heatmap card + reel [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Post to social media
        run: python scripts/post_sector_heatmap.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      # Sends the reel to TikTok as a draft (publish it from the TikTok app).
      # Skips if no reel was rendered this run, and a TikTok failure doesn't
      # fail the run — the other platforms have already posted by now.
      - name: Send to TikTok drafts
        continue-on-error: true
        run: python scripts/tiktok_post.py --reel heatmap
        env:
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GH_REPO:              ${{ github.repository }}

      - name: Commit posted tracking
        if: always()
        run: |
          git add data/posted_sector_heatmap.json data/posted_tiktok.json
          git diff --staged --quiet || git commit -m "chore: update posted sector heatmap [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
