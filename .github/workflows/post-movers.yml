name: Post Movers to Social Media

on:
  # Scheduled externally by cron-job.org (POSTs workflow_dispatch) — GitHub's own
  # cron delayed or dropped most runs. Thursdays 23:12 UTC, giving the ~20min
  # data lag time to settle.
  workflow_dispatch:
    inputs:
      date:
        description: 'Force a specific date label (YYYY-MM-DD) — skips "last market day"'
        required: false
        default: ''
      type:
        description: 'Force a specific post type — skips the random 1-of-2 pick'
        required: false
        type: choice
        options:
          - ''
          - movers
          - most_active

jobs:
  post-movers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate movers card
        run: python scripts/generate_movers_card.py
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}
          FORCE_TYPE: ${{ github.event.inputs.type }}

      - name: Commit card image
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/movers/
          git diff --staged --quiet || git commit -m "chore: add movers card [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Post to social media
        run: python scripts/post_movers.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      - name: Commit posted tracking
        run: |
          git add data/posted_movers.json
          git diff --staged --quiet || git commit -m "chore: update posted movers [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
