name: Post VIX Fear Gauge to Social Media

on:
  # Scheduled externally by cron-job.org (POSTs workflow_dispatch) — GitHub's own
  # cron delayed or dropped most runs. Mondays 15:47 UTC: weekend news tends to
  # show up in Monday's VIX, and it's mid-morning in New York year-round so the
  # reading has settled after the open.
  workflow_dispatch:
    inputs:
      date:
        description: 'Force a specific date label (YYYY-MM-DD) — skips "last market day"'
        required: false
        default: ''

jobs:
  post-vix-gauge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate VIX gauge card
        run: python scripts/generate_vix_gauge_card.py
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}

      - name: Generate VIX gauge reel
        run: python scripts/generate_vix_gauge_reel.py
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}

      - name: Commit card image and reel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/vix-gauge/ images/vix-gauge-reel/
          git diff --staged --quiet || git commit -m "chore: add VIX gauge card + reel [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Post to social media
        run: python scripts/post_vix_gauge.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      # Sends the reel to TikTok as a draft (publish it from the TikTok app).
      # Skips if no reel was rendered this run, and a TikTok failure doesn't
      # fail the run — the other platforms have already posted by now.
      - name: Send to TikTok drafts
        continue-on-error: true
        run: python scripts/tiktok_post.py --reel vix
        env:
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GH_REPO:              ${{ github.repository }}

      - name: Commit posted tracking
        if: always()
        run: |
          git add data/posted_vix_gauge.json data/posted_tiktok.json
          git diff --staged --quiet || git commit -m "chore: update posted VIX gauge [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
