name: Post $1,000 Invested Reel to Instagram

on:
  schedule:
    - cron: '37 15 * * 3,0'   # Wed/Sun at 15:37 UTC (4:37pm BST / 3:37pm GMT in winter) —
                               # evergreen content, so it fills the weekend gap left by the
                               # market-data posts (Saturday is the head-to-head reel, see
                               # post-h2h-reel.yml); offset off :00 to avoid GitHub's
                               # on-the-hour schedule congestion
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Force a ticker (e.g. NVDA) instead of the rotation'
        required: false
        default: ''

jobs:
  post-investment-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate reel
        run: python scripts/generate_investment_reel.py
        env:
          FORCE_TICKER: ${{ github.event.inputs.ticker }}

      - name: Commit reel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/investment-reel/ logos/
          git diff --staged --quiet || git commit -m "chore: add investment reel [skip ci]"
          git pull --rebase origin main
          git push

      - name: Post to social media
        run: python scripts/post_investment_reel.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      # Sends the same reel to TikTok as a draft (publish it from the TikTok
      # app). Skips itself if the TikTok secrets aren't set, and a TikTok
      # failure doesn't fail the run — Instagram has already posted by now.
      - name: Send to TikTok drafts
        continue-on-error: true
        run: python scripts/tiktok_post.py --reel investment
        env:
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GH_REPO:              ${{ github.repository }}

      - name: Commit posted tracking
        if: always()
        run: |
          git add data/posted_investment_reel.json data/posted_tiktok.json
          git diff --staged --quiet || git commit -m "chore: update posted investment reel [skip ci]"
          git pull --rebase origin main
          git push
