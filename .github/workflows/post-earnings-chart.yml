name: Post Earnings Charts to Social Media

on:
  # Paused (2026-10-08) — earnings content is posted manually for now, so this
  # isn't on cron-job.org. To resume, add a cron-job.org job (weekdays 14:41 and
  # 22:51 UTC), like the other workflows.
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Force-post specific tickers (e.g. NVDA,AAPL) — skips EDGAR filing check'
        required: false
        default: ''

jobs:
  post-earnings-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate earnings charts
        run: python scripts/generate_earnings_charts.py
        env:
          FORCE_TICKERS: ${{ github.event.inputs.tickers }}

      - name: Commit charts to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --cached scripts/_post_manifest.json 2>/dev/null || true
          git add images/earnings/ .gitignore
          git diff --staged --quiet || git commit -m "chore: add earnings charts [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Post to social media
        run: python scripts/post_earnings_charts.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      - name: Commit posted earnings tracking
        run: |
          git add data/posted_earnings.json
          git diff --staged --quiet || git commit -m "chore: update posted earnings [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
