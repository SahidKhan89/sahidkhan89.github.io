name: Reply to Market Posts on Threads

on:
  # Scheduled externally by cron-job.org (POSTs workflow_dispatch), like the
  # other workflows. One reply per run — keep it to ~4-5 runs a day at
  # irregular times.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft the reply and log it, but do not post'
        type: boolean
        default: true

jobs:
  reply-threads:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # needed to commit the updated tracking file

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run reply script
        run: node scripts/reply-threads.mjs
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          REPLY_DRY_RUN:        ${{ inputs.dry_run }}

      - name: Commit updated tracking file
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/replied_threads.json
          git diff --staged --quiet || git commit -m "chore: update replied threads [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
