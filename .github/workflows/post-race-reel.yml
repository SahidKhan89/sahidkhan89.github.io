name: Post $1,000 Race Reel to Instagram & Threads

on:
  schedule:
    - cron: '37 15 * * 0'   # Sundays at 15:37 UTC (4:37pm BST / 3:37pm GMT in winter) — 24 race
                             # groups = ~6 months before a repeat; offset off :00 to avoid
                             # GitHub's on-the-hour schedule congestion
  workflow_dispatch:
    inputs:
      race:
        description: 'Force a race group (e.g. mag7, chips, food) instead of the rotation'
        required: false
        default: ''

jobs:
  post-race-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate reel
        run: python scripts/generate_race_reel.py
        env:
          FORCE_RACE: ${{ github.event.inputs.race }}

      - name: Commit reel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/race-reel/ logos/
          git diff --staged --quiet || git commit -m "chore: add race reel [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Post to social media
        run: python scripts/post_race_reel.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      # Sends the same reel to TikTok as a draft (publish it from the TikTok
      # app). Skips itself if the TikTok secrets aren't set, and a TikTok
      # failure doesn't fail the run — Instagram and Threads have already
      # posted by now.
      - name: Send to TikTok drafts
        continue-on-error: true
        run: python scripts/tiktok_post.py --reel race
        env:
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GH_REPO:              ${{ github.repository }}

      - name: Commit posted tracking
        if: always()
        run: |
          git add data/posted_race_reel.json data/posted_tiktok.json
          git diff --staged --quiet || git commit -m "chore: update posted race reel [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
