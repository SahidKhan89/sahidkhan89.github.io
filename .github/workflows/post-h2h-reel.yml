name: Post Head-to-Head Reel to Instagram & Threads

on:
  # Scheduled externally by cron-job.org (POSTs workflow_dispatch) — GitHub's own
  # cron delayed or dropped most runs. Saturdays 15:37 UTC: one matchup a week
  # (24 in the rotation = ~6 months).
  workflow_dispatch:
    inputs:
      pair:
        description: 'Force a matchup (e.g. NVDA-AMD) instead of the rotation'
        required: false
        default: ''

jobs:
  post-h2h-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate reel
        run: python scripts/generate_h2h_reel.py
        env:
          FORCE_PAIR: ${{ github.event.inputs.pair }}

      - name: Commit reel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/h2h-reel/ logos/
          git diff --staged --quiet || git commit -m "chore: add head-to-head reel [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Post to social media
        run: python scripts/post_h2h_reel.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      # Sends the same reel to TikTok as a draft (publish it from the TikTok
      # app). Skips itself if the TikTok secrets aren't set, and a TikTok
      # failure doesn't fail the run — Instagram and Threads have already
      # posted by now.
      - name: Send to TikTok drafts
        continue-on-error: true
        run: python scripts/tiktok_post.py --reel h2h
        env:
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GH_REPO:              ${{ github.repository }}

      - name: Commit posted tracking
        if: always()
        run: |
          git add data/posted_h2h_reel.json data/posted_tiktok.json
          git diff --staged --quiet || git commit -m "chore: update posted head-to-head reel [skip ci]"
          # Retried: another workflow can push in between, and GitHub occasionally
          # rejects a push it has actually applied (seen on the CNBC workflow).
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
