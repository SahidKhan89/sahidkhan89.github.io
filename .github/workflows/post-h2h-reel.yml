name: Post Head-to-Head Reel to Instagram

on:
  schedule:
    - cron: '37 15 * * 6'   # Saturdays at 15:37 UTC (4:37pm BST / 3:37pm GMT in winter) — one
                             # matchup a week (24 in the rotation = ~6 months); the single-stock
                             # reel runs Wed/Sun. Offset off :00 to avoid GitHub's
                             # on-the-hour schedule congestion
  workflow_dispatch:
    inputs:
      pair:
        description: 'Force a matchup (e.g. NVDA-AMD) instead of the rotation'
        required: false
        default: ''

jobs:
  post-h2h-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate reel
        run: python scripts/generate_h2h_reel.py
        env:
          FORCE_PAIR: ${{ github.event.inputs.pair }}

      - name: Commit reel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/h2h-reel/ logos/
          git diff --staged --quiet || git commit -m "chore: add head-to-head reel [skip ci]"
          git pull --rebase origin main
          git push

      - name: Post to social media
        run: python scripts/post_h2h_reel.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GITHUB_REF_NAME:      ${{ github.ref_name }}

      - name: Commit posted tracking
        run: |
          git add data/posted_h2h_reel.json
          git diff --staged --quiet || git commit -m "chore: update posted head-to-head reel [skip ci]"
          git pull --rebase origin main
          git push
